name: Active Record Multi-Tenant Tests

env:
  CI: true
on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - uses: actions/checkout@v4
      - name: Rubocop static code analysis
        run: |
          gem install rubocop
          rubocop
  doc_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - uses: actions/checkout@v4
      - name: Install python dependencies
        run: |
          pip install -r docs/requirements.txt
      - name: Documentation Checks
        run: |
          cd docs
          sphinx-build -W -b html source builds

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
        appraisal:
          - rails_7.1
          - rails_7.2
          - rails_8.0
          - rails_8.1
          - sidekiq_7_rails_7.1
          - sidekiq_7_rails_7.2
          - sidekiq_7_rails_8.0
          - sidekiq_7_rails_8.1
        postgresql_version:
          - "14"
          - "15"
          - "16"
        exclude:
          # Rails 8.0 requires Ruby >= 3.2
          # Sidekiq 8.0 requires Ruby >= 3.2
          - ruby: "3.1"
            appraisal: rails_7.1
          - ruby: "3.1"
            appraisal: rails_7.2
          - ruby: "3.1"
            appraisal: rails_8.0
          - ruby: "3.1"
            appraisal: sidekiq_7_rails_8.0
          - ruby: "3.1"
            appraisal: rails_8.1
          - ruby: "3.1"
            appraisal: sidekiq_7_rails_8.1
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.appraisal }} / PostgreSQL ${{ matrix.postgresql_version }}
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.appraisal }}.gemfile
      POSTGRES_VERSION: ${{ matrix.postgresql_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL Database environment
        run: docker compose up -d

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Execute tests
        run: bundle exec rake spec

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
